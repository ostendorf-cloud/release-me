[tools]
go = "1.27.4"
task = "3"
# Pinned to the patch, not "2": a golangci-lint release is built against one Go patch and
# cannot read the stdlib export data of a newer one, so the two versions move together.
# 2.15.0 is verified against go 1.27.4 above; check "golangci-lint run" before moving either.
golangci-lint = "2.15.0"
actionlint = "1"
markdownlint-cli2 = "0.20"
yamllint = "1"
gitleaks = "8"
goreleaser = "2"
hadolint = "2"
shellcheck = "0"
# govulncheck has no entry in the mise or aqua registry, so it comes from
# mise's go backend, still pinned here and installed by "mise install" in CI
# like every other tool.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
