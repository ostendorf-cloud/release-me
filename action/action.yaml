name: release-me
description: Download release-me and run it against this repository.

inputs:
  token:
    description: Token with permission to open release pull requests and create releases.
    required: true
  download-token:
    description: >-
      Token sent when downloading the release archive and checksums, needed only for a private
      release-me fork. Defaults to the calling workflow's own token.
    required: false
    default: ""
  component:
    description: Limit the run to one configured component.
    required: false
    default: ""
  dry-run:
    description: Print what would change, write nothing.
    required: false
    default: "false"
  verbose:
    description: Enable debug logging on stderr.
    required: false
    default: "false"
  version:
    description: >-
      release-me release to run, without the "v" prefix, or "source" to build it with go build
      from this checkout instead of downloading a release. Defaults to the ref the action was
      invoked at when that ref is itself a release tag, then to the VERSION file shipped at
      the pinned commit, used whenever the invocation ref is not itself a release tag: a
      commit digest pin or a floating branch pin alike.
    required: false
    default: ""
  author-name:
    description: >-
      Deprecated, no longer applied. The release commit is created through the GitHub API
      under the token's own identity, so GitHub signs it.
    required: false
    default: ""
  author-email:
    description: >-
      Deprecated, no longer applied. The release commit is created through the GitHub API
      under the token's own identity, so GitHub signs it.
    required: false
    default: ""
  app-slug:
    description: >-
      Deprecated, no longer applied. A GitHub App token already makes the app's bot account,
      "<slug>[bot]", author the release commit, which GitHub creates and signs itself.
    required: false
    default: ""

outputs:
  tags:
    description: >-
      Newline-separated tags this run tagged a release for, one per released component, empty
      when nothing was released or dry-run was set. release-me.yaml's draft-until-assets-attach
      key decides what the release for each tag already is: false, the default, published
      immediately, no action required. True drafts it instead, since GitHub's immutable
      releases setting, when on, rejects a change to a published release, so release-me never
      publishes one itself; attach any assets and publish each tag yourself, for example with
      "gh release upload" and "gh release edit --draft=false".
    value: ${{ steps.release-me.outputs.tags }}
  released:
    description: >-
      "true" when this run tagged a release for any component, "false" otherwise and always
      in dry-run.
    value: ${{ steps.release-me.outputs.released }}
  components:
    description: >-
      JSON object keyed by every component this run handled, all configured ones unless the
      component input limits it, each {"released", "version", "tag", "pr"}: version and tag
      are empty unless released is true, pr is the release pull request object, as in prs,
      opened, updated or found up to date for that component this run, null otherwise. Read
      one with fromJSON(steps.<id>.outputs.components).<name>.released.
    value: ${{ steps.release-me.outputs.components }}
  pr:
    description: >-
      JSON object of the one release pull request this run opened, updated or found up to
      date, {"number", "url", "branch", "components"}, null when there was none or more than
      one; read prs for those. Test it with fromJSON(steps.<id>.outputs.pr) != null.
    value: ${{ steps.release-me.outputs.pr }}
  prs:
    description: >-
      JSON array of every release pull request this run opened, updated or found up to date,
      each shaped as pr, "[]" when none or dry-run was set. A locked family or a shared
      release pull request lists several components on one entry.
    value: ${{ steps.release-me.outputs.prs }}

runs:
  using: composite
  steps:
    - name: Resolve the version to run
      id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: ${{ github.action_path }}/resolve-version.sh

    - name: Resolve the runner platform
      id: platform
      if: steps.version.outputs.version != 'source'
      shell: bash
      run: ${{ github.action_path }}/resolve-platform.sh

    - name: Set up Go
      if: steps.version.outputs.version == 'source'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/../go.mod

    - name: Build release-me from source
      if: steps.version.outputs.version == 'source'
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: ${{ github.action_path }}/build-source.sh

    - name: Download the release archive and checksums
      if: steps.version.outputs.version != 'source'
      shell: bash
      env:
        DOWNLOAD_TOKEN: ${{ inputs.download-token || github.token }}
        VERSION: ${{ steps.version.outputs.version }}
        OS: ${{ steps.platform.outputs.os }}
        ARCH: ${{ steps.platform.outputs.arch }}
      run: ${{ github.action_path }}/download.sh

    - name: Verify the checksum
      if: steps.version.outputs.version != 'source'
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        OS: ${{ steps.platform.outputs.os }}
        ARCH: ${{ steps.platform.outputs.arch }}
      run: ${{ github.action_path }}/verify-checksum.sh

    - name: Extract the binary
      if: steps.version.outputs.version != 'source'
      shell: bash
      env:
        OS: ${{ steps.platform.outputs.os }}
        ARCH: ${{ steps.platform.outputs.arch }}
      run: ${{ github.action_path }}/extract.sh

    - name: Resolve the release commit author
      shell: bash
      env:
        INPUT_AUTHOR_NAME: ${{ inputs.author-name }}
        INPUT_AUTHOR_EMAIL: ${{ inputs.author-email }}
        INPUT_APP_SLUG: ${{ inputs.app-slug }}
        GH_TOKEN: ${{ inputs.download-token || github.token }}
      run: ${{ github.action_path }}/resolve-author.sh

    - name: Run release-me
      id: release-me
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        COMPONENT: ${{ inputs.component }}
        DRY_RUN: ${{ inputs.dry-run }}
        VERBOSE: ${{ inputs.verbose }}
      run: ${{ github.action_path }}/run-release-me.sh
