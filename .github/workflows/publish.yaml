name: publish

# release-me.yaml sets draft-until-assets-attach: true, so release.yaml
# already attaches and publishes the binary assets itself, right after
# release-me drafts a release: a draft fires no "release" webhook, so a
# second workflow waiting on one would never run here. This job has no
# "assets" step of its own because of that; a repository that leaves the
# key off instead gets its release published immediately and keeps that
# step, triggered by this same "published" webhook. See
# docs/adr/0001-draft-releases-until-assets-attach.md. Publishing a draft
# does fire "published" (never "created"), so this workflow still runs,
# just once release.yaml has finished.
on:
  release:
    types: [published]

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Resolve the image tags
        id: tags
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          version="${TAG_NAME#v}"
          tags="${IMAGE}:${version}"
          if [ "${PRERELEASE}" != "true" ]; then
            tags="$(printf '%s\n%s' "${tags}" "${IMAGE}:latest")"
          fi
          {
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
