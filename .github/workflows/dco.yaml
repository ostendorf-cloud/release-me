name: dco

# This repository's own DCO enforcement now delegates to the shared reusable
# workflow in ostendorf-cloud/workflows instead of carrying a copy of the
# job.
#
# "secrets: inherit" forwards GH_APP_SECURITY_PRIVATE_KEY, which the reusable
# workflow declares as an optional secret and uses to publish the verdict as
# a check run owned by this organisation's own security app. Without it the
# check still enforces through the job's own pass/fail status, which is also
# what a pull request from a fork gets.
#
# "pull_request", never "pull_request_target", is kept here because the
# trigger is the caller's own: "pull_request_target" would hand a fork's
# code the app's installation token.
#
# The reusable workflow checks out its own repository at the commit the
# caller resolved and runs its own copy of scripts/check-dco.sh. It reads
# no file of this repository. This repository keeps its copy and
# scripts/check-dco_test.sh for local runs and as a parity reference. Both
# copies are byte-identical today. The test checks only the behaviour of
# this copy, so a drift shows only in a comparison of the two files, for
# example of their "git hash-object" values.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signoff:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-dco.yaml@v0
    secrets: inherit
