name: dco

# This repository's own DCO enforcement now delegates to the shared reusable
# workflow in ostendorf-cloud/workflows instead of carrying a copy of the
# job.
#
# "secrets: inherit" forwards GH_APP_SECURITY_PRIVATE_KEY, which the reusable
# workflow declares as an optional secret and uses to publish the verdict as
# a check run owned by this organisation's own security app. Without it the
# check still enforces through the job's own pass/fail status, which is also
# what a pull request from a fork gets.
#
# "pull_request", never "pull_request_target", is kept here because the
# trigger is the caller's own: "pull_request_target" would hand a fork's
# code the app's installation token.
#
# scripts/check-dco.sh stays in this repository on purpose. The reusable
# workflow's own actions/checkout step checks out the CALLING repository
# (actions/checkout defaults "repository" to "github.repository", which in a
# reusable workflow is the caller), and the workflow then runs
# "./scripts/check-dco.sh" from that checkout. Removing the script here
# would break the check. The copy in this repository is byte-identical to
# the one in the workflows repository, and scripts/check-dco_test.sh keeps
# it that way.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signoff:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-dco.yaml@0906f36104c9a448d409732f4b24ece1a0398d26 # v0.1.0
    secrets: inherit
