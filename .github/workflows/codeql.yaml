name: codeql

# The analysis itself comes from the shared reusable workflow in
# ostendorf-cloud/workflows instead of a copy of the CodeQL job.
#
# The triggers stay here: a "workflow_call" workflow carries none of its
# own, so push, pull_request and the weekly schedule are the caller's.
#
# "languages" is Go alone, this repository's only compiled language. The
# reusable workflow builds Go with CodeQL's autobuild mode and runs mise
# first so the pinned Go toolchain is on PATH.
#
# The permissions block stays here because the token a called workflow gets
# is the caller's.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # CodeQL's own recommended default: a weekly run catches newly
    # disclosed vulnerability patterns in code that has not changed.
    - cron: "23 4 * * 1"

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-codeql.yaml@91979cf4cff86d00ebee28dfaf6e3b452aaeb1a9 # v0.2.2
    with:
      languages: '["go"]'
