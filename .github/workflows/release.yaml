name: release

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, unlabeled]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The label list is release-me.yaml's defaults, spelled out: the condition
    # cannot read the configuration.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-me/') &&
      contains(
        fromJSON('["release: pending", "release: tagged", "release: alpha", "release: beta", "release: rc"]'),
        github.event.label.name
      ))
    steps:
      - name: Mint a release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.GH_APP_RELEASE_APP_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          # A label event checks out the base branch, never the merge ref.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.sha }}
          fetch-depth: 0

      # The released action and the released binary, not this checkout:
      # release-me releases itself with the last version it actually shipped,
      # so a broken change on main cannot take its own release path down with
      # it. The commit digest is the one v0.5.0 points at; the version input
      # names the release to download, which the action verifies against the
      # published checksums.
      - name: Tag and draft a release for every merged release pull request
        id: release-me
        uses: ostendorf-cloud/release-me/action@e3346c4a5aa463642e8d0627b01b3308dc49e2ec  # v0.5.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          version: "0.5.0"

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
        if: steps.release-me.outputs.tags != ''

      # release-me.yaml sets github-release-draft-until-assets-attach: true, so this
      # repository's own release is a draft, and publishing it is on this
      # same job: a draft fires no "release" webhook at all, so a second,
      # webhook-triggered workflow would never run. A repository that
      # leaves the key off instead publishes immediately and attaches
      # assets the old way, through publish.yaml's own webhook-triggered
      # job. See docs/adr/0001-draft-releases-until-assets-attach.md.
      - name: Build, attach and publish the assets for every tag just released
        if: steps.release-me.outputs.tags != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TAGS: ${{ steps.release-me.outputs.tags }}
        run: ./scripts/publish-release-assets.sh

  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every other filter, the release pull request's own labels included,
    # is the comment command's own job: nothing here reads release-me.yaml,
    # so the mention and the label names stay unchecked until it runs.
    # "user.type != 'Bot'" additionally keeps this job from ever running
    # on its own reply: without it, a reply naming the mention, however
    # carefully worded, would still start a new run, and an app
    # installation token, not GITHUB_TOKEN, has every permission needed
    # to keep that loop going.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.type != 'Bot'
    steps:
      - name: Mint a release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.GH_APP_RELEASE_APP_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.repository.default_branch }}
          # A "release-as" command now calls into the same pr logic a push
          # to the default branch does, to recompute the release pull
          # request's title and changelog immediately: that logic walks
          # first-parent history and lists tags, both missing from the
          # default, shallow checkout.
          fetch-depth: 0

      # The released binary, not a build from this checkout, matching the
      # release job above: the checkout here is the default branch, whose code
      # is unreleased. The composite action cannot be reused for it, because
      # the action runs the release flow and this job runs the "comment"
      # command, so the action's own download, verify and extract chain is
      # spelled out here instead, through gh rather than curl because this
      # repository's release scripts already reach for gh and the runner
      # ships it. The checksum is verified before anything extracts or runs.
      #
      # linux_amd64 is hardcoded against this job's own "runs-on:
      # ubuntu-latest" above. A different runner needs a different archive.
      - name: Download the pinned release-me release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: "0.5.0"
        run: |
          cd "${RUNNER_TEMP}"

          archive="release-me_linux_amd64.tar.gz"
          checksums="release-me_${VERSION}_checksums.txt"

          gh release download "v${VERSION}" \
            --repo ostendorf-cloud/release-me \
            --pattern "${archive}" \
            --pattern "${checksums}"

          # Escape the "." in the file name so it is not a regex metacharacter.
          pattern="${archive//./\\.}"
          grep -E " ${pattern}\$" "${checksums}" | sha256sum -c -

          tar -xzf "${archive}" release-me
          chmod +x release-me

      - name: Apply the comment command
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          "${RUNNER_TEMP}/release-me" comment \
            --pr-number "${PR_NUMBER}" \
            --association "${COMMENT_ASSOCIATION}" \
            --body "${COMMENT_BODY}"
